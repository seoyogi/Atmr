<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>OpenMap 3D Drive</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  touch-action: none;
}
canvas { display: block; }
#joystick {
  position: absolute;
  bottom: 80px;
  left: 40px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
}
#stick {
  position: absolute;
  width: 60px;
  height: 60px;
  left: 30px;
  top: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
}
</style>
</head>
<body>

<div id="joystick"><div id="stick"></div></div>

<script async src="https://cdn.jsdelivr.net/npm/ammo.js"></script>

<script type="module">
import { startGame } from "./js/main.js";
Ammo().then(() => {
  startGame();
});
</script>

</body>
</html>
