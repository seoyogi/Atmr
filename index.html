<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Open Map Car Game</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/ammo.js"></script>
</head>
<body>
<canvas id="renderCanvas" style="width:100%; height:100%;"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

const createScene = async function () {
    const scene = new BABYLON.Scene(engine);

    const camera = new BABYLON.ArcRotateCamera("camera",
        Math.PI/2, Math.PI/3, 20,
        new BABYLON.Vector3(0,0,0), scene);
    camera.attachControl(canvas, true);

    const light = new BABYLON.HemisphericLight("light",
        new BABYLON.Vector3(0,1,0), scene);

    const ground = BABYLON.MeshBuilder.CreateGround("ground",
        {width:100, height:100}, scene);

    const car = BABYLON.MeshBuilder.CreateBox("car",
        {width:2, height:1, depth:4}, scene);
    car.position.y = 0.5;

    let speed = 0;

    window.addEventListener("keydown", async (e)=>{
        if(e.key === "ArrowUp"){
            const res = await fetch("http://127.0.0.1:8000/speed?input=1");
            const data = await res.json();
            speed = data.speed;
        }
        if(e.key === "ArrowDown"){
            speed -= 0.05;
        }
    });

    scene.onBeforeRenderObservable.add(()=>{
        car.position.z += speed;
    });

    return scene;
};

createScene().then(scene=>{
    engine.runRenderLoop(()=>{
        scene.render();
    });
});
</script>
</body>
</html>
