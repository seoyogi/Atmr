<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Low Poly Car Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}
#renderCanvas {
  width: 100%;
  height: 100%;
  touch-action: none;
}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<!-- Babylon本体 -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<!-- ★ これが超重要：glTFローダー -->
<script src="https://cdn.babylonjs.com/loaders/babylon.glTFFileLoader.js"></script>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

const createScene = function () {
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.8, 0.9, 1.0, 1);

  // カメラ
  const camera = new BABYLON.ArcRotateCamera(
    "camera",
    Math.PI / 2,
    Math.PI / 3,
    6,
    new BABYLON.Vector3(0, 0.5, 0),
    scene
  );
  camera.attachControl(canvas, true);

  // ライト
  const light = new BABYLON.HemisphericLight(
    "light",
    new BABYLON.Vector3(0, 1, 0),
    scene
  );
  light.intensity = 1.2;

  // 地面
  const ground = BABYLON.MeshBuilder.CreateGround("ground", {
    width: 20,
    height: 20
  }, scene);

  const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
  groundMat.diffuseColor = new BABYLON.Color3(0.4, 0.8, 0.4);
  ground.material = groundMat;

  // ===== GLB読み込み =====
  BABYLON.SceneLoader.ImportMesh(
    "",
    "./",
    "Car.glb",
    scene,
    function (meshes) {
      const root = meshes[0];
      root.scaling = new BABYLON.Vector3(1, 1, 1);
      root.position = new BABYLON.Vector3(0, 0, 0);

      console.log("Car loaded!");
    },
    null,
    function (scene, message) {
      console.error("Load error:", message);
    }
  );

  return scene;
};

const scene = createScene();

engine.runRenderLoop(function () {
  scene.render();
});

window.addEventListener("resize", function () {
  engine.resize();
});
</script>
</body>
</html>
